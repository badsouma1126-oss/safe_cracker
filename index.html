<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SAFE CRACKER - 2P</title>
<style>
:root{color-scheme:dark;--blue:#17385e;--gold:#ffb21a;--muted:#9fb4cb}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 42%,#315b83 0,#1b3e65 55%,#102944 100%);font-family:system-ui,"Noto Sans JP",sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.game{width:min(1100px,100%);padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:clamp(20px,3vw,30px);letter-spacing:.16em;margin:0}
.sub{font-size:11px;letter-spacing:.2em;color:#b7cce0}
.timer{font-variant-numeric:tabular-nums;font-size:clamp(22px,4vw,34px);font-weight:800;background:#071a2b99;border:1px solid #7895b4;border-radius:12px;padding:7px 15px;min-width:100px;text-align:center}
.players{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.player{background:#071b2c77;border:1px solid #7894b0;border-radius:18px;padding:16px;box-shadow:0 12px 30px #06172755}
.player h2{font-size:15px;letter-spacing:.13em;margin:0 0 4px}
.hint{font-size:12px;color:#bfd0e0;min-height:18px}
.lights{display:flex;gap:10px;justify-content:center;margin:8px 0 4px}
.bulb{width:25px;height:34px;display:grid;place-items:center;color:#71869d;font-size:24px;filter:grayscale(1);opacity:.55}
.bulb.done{color:#ffdc57;filter:none;opacity:1;text-shadow:0 0 12px #ffd84a}
.dial-wrap{display:flex;justify-content:center;padding:8px 0}
.dial{width:min(31vw,270px);min-width:190px;aspect-ratio:1;border-radius:50%;position:relative;touch-action:none;cursor:grab;background:radial-gradient(circle,#25496c 0 53%,#0c2239 54% 58%,#b5c7d8 59% 60%,#183956 61% 100%);box-shadow:inset 0 0 25px #071522,0 8px 18px #07152277;border:2px solid #9ab0c7}
.dial:active{cursor:grabbing}
.ticks{position:absolute;inset:9%;border-radius:50%;background:repeating-conic-gradient(from -1deg,#d9e5ef 0deg 1deg,transparent 1deg 6deg);mask:radial-gradient(circle,transparent 0 76%,#000 77% 81%,transparent 82%)}
.needle{position:absolute;width:4px;height:42%;left:calc(50% - 2px);top:8%;background:linear-gradient(#ffdf70,#ff8c00);border-radius:5px;transform-origin:50% 100%;transform:rotate(0deg);filter:drop-shadow(0 0 5px #ffad18);pointer-events:none}
.hub{position:absolute;width:25%;aspect-ratio:1;border-radius:50%;left:37.5%;top:37.5%;background:radial-gradient(circle at 35% 30%,#d9e3eb,#657f98 35%,#203b55 72%);border:4px solid #b9cad8;box-shadow:0 3px 10px #071727;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.1em}
.dial.near .hub{box-shadow:0 0 0 5px #ffd34a55,0 0 22px #ffd34a}
.controls{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 17px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.lock{background:linear-gradient(#ffe28b,#f2a91d);color:#392300;box-shadow:0 4px 0 #9d5d08}
.lock:active{transform:translateY(2px);box-shadow:0 2px 0 #9d5d08}
.reset{background:#294966;color:#e8f2fa;border:1px solid #7894b0}
.status{text-align:center;min-height:22px;margin-top:8px;font-size:13px;color:#ffe49a}
footer{text-align:center;color:#b5c9dc;font-size:12px;margin-top:14px;line-height:1.7}
.overlay{position:fixed;inset:0;background:#071827d9;display:grid;place-items:center;padding:20px;z-index:5}
.modal{width:min(480px,100%);background:linear-gradient(145deg,#24496e,#102b47);border:1px solid #91abc4;border-radius:20px;padding:26px;text-align:center;box-shadow:0 20px 70px #0009}
.modal h2{letter-spacing:.16em;margin:0 0 10px}
.modal p{color:#d0dfed;line-height:1.7;font-size:14px}
.start{background:#ffca4d;color:#382400;font-size:16px;padding:13px 28px}
@media(max-width:650px){.game{padding:10px}.players{gap:8px}.player{padding:10px 6px}.dial{min-width:0;width:min(44vw,230px)}.player h2{font-size:12px}.hint{font-size:10px}.lights{gap:5px}.bulb{font-size:20px;width:20px}.lock{padding:10px 12px;font-size:11px}}

.image-dial{background:transparent;border:0;box-shadow:none;overflow:visible;display:flex;align-items:center;justify-content:center;position:relative}
.dial-art{position:absolute;inset:0;margin:auto;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%;user-select:none;-webkit-user-drag:none;pointer-events:none;transform:rotate(0deg);filter:none;transition:filter .12s}
.image-dial.near .dial-art{filter:none}
</style>
</head>

 if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended') audioCtx.resume();

function tone(freq,duration=.07,type='sine',volume=.045,delay=0){
 if(!soundOn)return;
 audioReady();
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();

 o.connect(g);g.connect(audioCtx.destination);

}

customClickAudio.preload = "auto";
customClickAudio.volume = 0.22; // 元音声より音量を抑える
function foundClick(){
 if(!soundOn)return;
 try{customClickAudio.pause();customClickAudio.currentTime=0;}
 catch(e){}
 const playback=customClickAudio.play();
 if(playback && playback.catch) playback.catch(()=>{});
}

function lockSound(){tone(520,.09,'triangle',.06);tone(880,.13,'sine',.045,.07)}
function failSound(){tone(170,.16,'sawtooth',.04);tone(115,.18,'sawtooth',.025,.08)}
function winSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.24,'sine',.055,i*.11))}
$('soundToggle').onclick=()=>{
 soundOn=!soundOn;
 $('soundToggle').textContent=soundOn?'🔊 音 ON':'🔇 音 OFF';
 if(soundOn){audioReady();tone(660,.08,'sine',.04)}
};
function norm(a){return (a%360+360)%360}
function diff(a,b){let d=Math.abs(norm(a)-norm(b));return Math.min(d,360-d)}
function render(i){
 const p=players[i],dial=$('dial'+i);
 dial.querySelector('.dial-art').style.transform=`rotate(${p.angle}deg)`;
 const near=diff(p.angle,p.target)<2.5;
 dial.classList.toggle('near',false);
 if(near&&!wasNear[i]) foundClick();
 wasNear[i]=near;
 $('panel'+i).querySelectorAll('.bulb').forEach((b,j)=>b.classList.toggle('done',j<p.done));
}
function pointerAngle(e,dial){const r=dial.getBoundingClientRect();return norm(Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90)}
[0,1].forEach(i=>{
 const dial=$('dial'+i);let dragging=false,lastPointer=0;
 dial.addEventListener('pointerdown',e=>{if(!running||players[i].done>=3)return;audioReady();dragging=true;tickAccumulator=0;lastPointer=pointerAngle(e,dial);dial.setPointerCapture(e.pointerId)});
 dial.addEventListener('pointermove',e=>{if(!dragging)return;let a=pointerAngle(e,dial),delta=a-lastPointer;if(delta>180)delta-=360;if(delta< -180)delta+=360;players[i].angle=norm(players[i].angle+delta);lastPointer=a;tickAccumulator+=Math.abs(delta);if(tickAccumulator>=4){tickSound();tickAccumulator=0}render(i)});
 dial.addEventListener('pointerup',()=>dragging=false);dial.addEventListener('pointercancel',()=>dragging=false);
 $('lock'+i).onclick=()=>lock(i);
});
function lock(i){
 if(!running||players[i].done>=3)return;
 const p=players[i];
 if(diff(p.angle,p.target)<=8){
  p.done++;p.target=Math.random()*360;p.angle=0;wasNear[i]=false;lockSound();render(i);
  $('status'+i).textContent=p.done===3?'金庫を開けた！':`ロック解除！ あと${3-p.done}個`;
  if(p.done===3)finish(i);
 }else{
  $('status'+i).textContent='まだ違う… もう少し探そう';failSound();
  $('dial'+i).animate([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],250);
 }
}
function finish(winner){
 running=false;cancelAnimationFrame(raf);winSound();
 $('modalTitle').textContent=`PLAYER ${winner+1} WIN!`;
 $('modalText').textContent=`プレイヤー${winner+1}が先に3つのロックを解除した！`;
 $('start').textContent='もう一度遊ぶ';$('overlay').style.display='grid';
}
function tick(t){
 if(!running)return;
 if(!last)last=t;let dt=(t-last)/1000;last=t;remaining-=dt;
 if(remaining<=0){remaining=0;running=false;failSound();$('modalTitle').textContent='TIME UP';$('modalText').textContent='時間切れ！ もう一度挑戦しよう。';$('start').textContent='もう一度遊ぶ';$('overlay').style.display='grid';}
 $('timer').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(Math.floor(remaining%60)).padStart(2,'0')}`;
 if(running)raf=requestAnimationFrame(tick);
}
$('start').onclick=()=>{
